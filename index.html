<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biological Macromolecules Quiz | اختبار الجزيئات الحيوية الكبيرة</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2563eb;
  --primary-light: #dbeafe;
  --success: #16a34a;
  --success-light: #dcfce7;
  --error: #dc2626;
  --error-light: #fee2e2;
  --warning: #f59e0b;
  --warning-light: #fef3c7;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #1e293b;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

body.ar {
  font-family: 'Noto Sans Arabic', sans-serif;
  direction: rtl;
  text-align: right;
}

.container {
  max-width: 820px;
  margin: 0 auto;
  padding: 20px;
}

/* Header */
.quiz-header {
  background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #06b6d4 100%);
  color: white;
  border-radius: 16px;
  padding: 32px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}

.quiz-header::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 300px;
  height: 300px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}

.quiz-header h1 {
  font-size: 1.75rem;
  font-weight: 700;
  margin-bottom: 8px;
  position: relative;
}

.quiz-header p {
  font-size: 0.95rem;
  opacity: 0.9;
  position: relative;
}

.header-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
  position: relative;
}

.lang-toggle {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 500;
  transition: all 0.2s;
}

.lang-toggle:hover {
  background: rgba(255,255,255,0.35);
}

/* Progress */
.progress-bar-container {
  background: var(--card);
  border-radius: 12px;
  padding: 16px 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 16px;
}

.progress-text {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  min-width: 100px;
}

.progress-track {
  flex: 1;
  height: 10px;
  background: #e2e8f0;
  border-radius: 5px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #06b6d4);
  border-radius: 5px;
  transition: width 0.5s ease;
  width: 0%;
}

.score-display {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--primary);
  white-space: nowrap;
}

/* Question Card */
.question-card {
  background: var(--card);
  border-radius: 16px;
  padding: 32px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  animation: slideIn 0.4s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.question-number {
  display: inline-block;
  background: var(--primary-light);
  color: var(--primary);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 12px;
}

.question-text {
  font-size: 1.15rem;
  font-weight: 600;
  line-height: 1.7;
  margin-bottom: 24px;
  color: var(--text);
}

/* Options */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option-btn {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 20px;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  width: 100%;
  font-size: 0.95rem;
  line-height: 1.5;
  font-family: inherit;
  color: var(--text);
}

body.ar .option-btn {
  text-align: right;
}

.option-btn:hover:not(.selected):not(.disabled) {
  border-color: var(--primary);
  background: var(--primary-light);
  transform: translateX(4px);
}

body.ar .option-btn:hover:not(.selected):not(.disabled) {
  transform: translateX(-4px);
}

.option-letter {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  min-width: 32px;
  border-radius: 50%;
  background: #f1f5f9;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--text-muted);
  transition: all 0.2s;
}

.option-btn:hover:not(.selected):not(.disabled) .option-letter {
  background: var(--primary);
  color: white;
}

.option-btn.correct {
  border-color: var(--success);
  background: var(--success-light);
}

.option-btn.correct .option-letter {
  background: var(--success);
  color: white;
}

.option-btn.incorrect {
  border-color: var(--error);
  background: var(--error-light);
}

.option-btn.incorrect .option-letter {
  background: var(--error);
  color: white;
}

.option-btn.show-correct {
  border-color: var(--success);
  background: var(--success-light);
}

.option-btn.show-correct .option-letter {
  background: var(--success);
  color: white;
}

.option-btn.disabled {
  cursor: default;
  opacity: 0.75;
}

/* Feedback */
.feedback-box {
  margin-top: 20px;
  padding: 20px 24px;
  border-radius: 12px;
  font-size: 0.9rem;
  line-height: 1.7;
  animation: fadeIn 0.3s ease;
  display: none;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.feedback-box.correct {
  background: var(--success-light);
  border-left: 4px solid var(--success);
  display: block;
}

.feedback-box.incorrect {
  background: var(--error-light);
  border-left: 4px solid var(--error);
  display: block;
}

body.ar .feedback-box.correct,
body.ar .feedback-box.incorrect {
  border-left: none;
  border-right: 4px solid var(--success);
}

body.ar .feedback-box.incorrect {
  border-right-color: var(--error);
}

.feedback-title {
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.feedback-title .icon {
  font-size: 1.2rem;
}

/* Navigation */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.nav-btn {
  padding: 12px 28px;
  border-radius: 10px;
  border: none;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.nav-btn.primary {
  background: var(--primary);
  color: white;
}

.nav-btn.primary:hover {
  background: #1d4ed8;
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.nav-btn.secondary {
  background: #f1f5f9;
  color: var(--text);
}

.nav-btn.secondary:hover {
  background: #e2e8f0;
}

.nav-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none !important;
}

/* Results Screen */
.results-card {
  background: var(--card);
  border-radius: 16px;
  padding: 40px;
  text-align: center;
  box-shadow: var(--shadow-lg);
  animation: slideIn 0.5s ease;
  display: none;
}

.results-card.show { display: block; }

.results-icon {
  font-size: 4rem;
  margin-bottom: 16px;
}

.results-card h2 {
  font-size: 1.5rem;
  margin-bottom: 8px;
}

.results-score {
  font-size: 3rem;
  font-weight: 700;
  color: var(--primary);
  margin: 16px 0;
}

.results-message {
  font-size: 1rem;
  color: var(--text-muted);
  margin-bottom: 24px;
  line-height: 1.7;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
}

.results-breakdown {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin: 24px 0;
  flex-wrap: wrap;
}

.breakdown-item {
  text-align: center;
}

.breakdown-number {
  font-size: 1.5rem;
  font-weight: 700;
}

.breakdown-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 4px;
}

.breakdown-item.correct-count .breakdown-number { color: var(--success); }
.breakdown-item.incorrect-count .breakdown-number { color: var(--error); }

.retry-btn {
  background: var(--primary);
  color: white;
  border: none;
  padding: 14px 36px;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  margin-top: 8px;
}

.retry-btn:hover {
  background: #1d4ed8;
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

/* Question dots */
.question-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #e2e8f0;
  transition: all 0.3s;
  cursor: pointer;
}

.dot.active { background: var(--primary); transform: scale(1.3); }
.dot.answered-correct { background: var(--success); }
.dot.answered-incorrect { background: var(--error); }

/* Responsive */
@media (max-width: 600px) {
  .container { padding: 12px; }
  .quiz-header { padding: 24px 20px; }
  .quiz-header h1 { font-size: 1.35rem; }
  .question-card { padding: 24px 20px; }
  .results-card { padding: 28px 20px; }
  .results-breakdown { gap: 20px; }
}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="quiz-header">
    <h1 id="quizTitle">Biological Macromolecules Quiz</h1>
    <p id="quizSubtitle">Test your understanding of carbohydrate structure, function, and lactose intolerance</p>
    <div class="header-controls">
      <span id="quizMeta">10 Questions &middot; ~12 minutes</span>
      <button class="lang-toggle" onclick="toggleLang()" id="langBtn">العربية</button>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-bar-container">
    <span class="progress-text" id="progressText">Question 1 / 10</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="score-display" id="scoreDisplay">Score: 0</span>
  </div>

  <!-- Question Dots -->
  <div class="question-dots" id="questionDots"></div>

  <!-- Question Card -->
  <div class="question-card" id="questionCard">
    <span class="question-number" id="questionNumber">Question 1</span>
    <p class="question-text" id="questionText"></p>
    <div class="options-list" id="optionsList"></div>
    <div class="feedback-box" id="feedbackBox">
      <div class="feedback-title" id="feedbackTitle"></div>
      <p id="feedbackText"></p>
    </div>
    <div class="nav-buttons">
      <button class="nav-btn secondary" id="prevBtn" onclick="prevQuestion()" disabled>
        <span id="prevLabel">&#8592; Previous</span>
      </button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextQuestion()" disabled>
        <span id="nextLabel">Next &#8594;</span>
      </button>
    </div>
  </div>

  <!-- Results -->
  <div class="results-card" id="resultsCard">
    <div class="results-icon" id="resultsIcon"></div>
    <h2 id="resultsTitle">Quiz Complete!</h2>
    <div class="results-score" id="resultsScore"></div>
    <p class="results-message" id="resultsMessage"></p>
    <div class="results-breakdown">
      <div class="breakdown-item correct-count">
        <div class="breakdown-number" id="correctCount">0</div>
        <div class="breakdown-label" id="correctLabel">Correct</div>
      </div>
      <div class="breakdown-item incorrect-count">
        <div class="breakdown-number" id="incorrectCount">0</div>
        <div class="breakdown-label" id="incorrectLabel">Incorrect</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-number" id="totalCount">10</div>
        <div class="breakdown-label" id="totalLabel">Total</div>
      </div>
    </div>
    <button class="retry-btn" onclick="restartQuiz()" id="retryBtn">Try Again</button>
  </div>
</div>

<script>
// ===== QUIZ DATA =====
const questions = [
  {
    en: {
      q: "What is the primary function of carbohydrates in living organisms?",
      options: [
        "Storing genetic information",
        "Providing energy and structural support",
        "Catalyzing biochemical reactions",
        "Transporting oxygen in the blood"
      ],
      correct: 1,
      feedback_correct: "Exactly right! Carbohydrates serve as the body's primary energy source. Glucose, a simple sugar, fuels cellular respiration. Additionally, structural carbohydrates like cellulose (in plants) and chitin (in insects) provide physical support. Think of carbohydrates as both the fuel and the building materials of life.",
      feedback_incorrect: "Not quite. While other macromolecules handle genetic information (nucleic acids), catalysis (enzymes/proteins), and oxygen transport (hemoglobin), carbohydrates are specialized for energy provision and structural support. Glucose is the cell's preferred fuel, and polysaccharides like cellulose form rigid cell walls in plants."
    },
    ar: {
      q: "ما هي الوظيفة الأساسية للكربوهيدرات في الكائنات الحية؟",
      options: [
        "تخزين المعلومات الوراثية",
        "توفير الطاقة والدعم الهيكلي",
        "تحفيز التفاعلات الكيميائية الحيوية",
        "نقل الأكسجين في الدم"
      ],
      correct: 1,
      feedback_correct: "إجابة صحيحة! تعمل الكربوهيدرات كمصدر رئيسي للطاقة في الجسم. الجلوكوز، وهو سكر بسيط، يغذي التنفس الخلوي. بالإضافة إلى ذلك، توفر الكربوهيدرات الهيكلية مثل السليولوز (في النباتات) والكيتين (في الحشرات) الدعم الفيزيائي.",
      feedback_incorrect: "ليس تماماً. بينما تتولى الجزيئات الكبيرة الأخرى المعلومات الوراثية (الأحماض النووية) والتحفيز (الإنزيمات/البروتينات) ونقل الأكسجين (الهيموغلوبين)، تتخصص الكربوهيدرات في توفير الطاقة والدعم الهيكلي."
    }
  },
  {
    en: {
      q: "Which chemical reaction joins two monosaccharides together to form a disaccharide?",
      options: [
        "Hydrolysis",
        "Oxidation",
        "Dehydration synthesis (condensation reaction)",
        "Reduction"
      ],
      correct: 2,
      feedback_correct: "Correct! Dehydration synthesis (also called a condensation reaction) links two monosaccharides by removing a water molecule (H\u2082O). One monomer loses an -OH group and the other loses an -H, forming a covalent glycosidic bond. This is the same mechanism used to build all biological polymers from their monomers.",
      feedback_incorrect: "That's not right. Dehydration synthesis is the reaction that joins monomers together. During this process, a water molecule is released as a byproduct \u2014 one monomer contributes -OH and the other contributes -H. Hydrolysis is the reverse: it breaks bonds by adding water. Remember: 'dehydration' = removing water to build; 'hydrolysis' = adding water to break."
    },
    ar: {
      q: "أي تفاعل كيميائي يربط سكرين أحاديين معاً لتكوين سكر ثنائي؟",
      options: [
        "التحلل المائي",
        "الأكسدة",
        "تفاعل نزع الماء (تفاعل التكثيف)",
        "الاختزال"
      ],
      correct: 2,
      feedback_correct: "صحيح! يربط تفاعل نزع الماء (التكثيف) بين سكرين أحاديين عن طريق إزالة جزيء ماء (H\u2082O). يفقد أحد المونومرات مجموعة -OH والآخر يفقد -H، مكوناً رابطة غلايكوسيدية تساهمية.",
      feedback_incorrect: "ليست الإجابة الصحيحة. تفاعل نزع الماء هو التفاعل الذي يربط المونومرات معاً. خلال هذه العملية، يتم إطلاق جزيء ماء كمنتج ثانوي. التحلل المائي هو العكس: يكسر الروابط بإضافة الماء."
    }
  },
  {
    en: {
      q: "Lactose is a disaccharide composed of which two monosaccharides?",
      options: [
        "Glucose and fructose",
        "Glucose and galactose",
        "Fructose and galactose",
        "Glucose and ribose"
      ],
      correct: 1,
      feedback_correct: "That's right! Lactose (milk sugar) is a disaccharide formed from glucose and galactose joined by a \u03B2-1,4-glycosidic bond. This specific bond is what requires the enzyme lactase to break it down. Interestingly, sucrose (table sugar) is glucose + fructose, while maltose is glucose + glucose.",
      feedback_incorrect: "Not quite. Lactose is specifically composed of glucose and galactose. A helpful memory aid: Lactose = 'Lac' (milk) contains Galactose (both have 'a' as the second vowel). Sucrose (table sugar) is the one made of glucose + fructose. Knowing the composition helps explain why lactose intolerance specifically involves the lactase enzyme."
    },
    ar: {
      q: "اللاكتوز هو سكر ثنائي يتكون من أي سكرين أحاديين؟",
      options: [
        "الجلوكوز والفركتوز",
        "الجلوكوز والغالاكتوز",
        "الفركتوز والغالاكتوز",
        "الجلوكوز والريبوز"
      ],
      correct: 1,
      feedback_correct: "صحيح! اللاكتوز (سكر الحليب) هو سكر ثنائي يتكون من الجلوكوز والغالاكتوز مرتبطين برابطة غلايكوسيدية \u03B2-1,4. هذه الرابطة المحددة هي التي تحتاج إلى إنزيم اللاكتيز لتكسيرها.",
      feedback_incorrect: "ليس صحيحاً. يتكون اللاكتوز تحديداً من الجلوكوز والغالاكتوز. السكروز (سكر المائدة) هو الذي يتكون من الجلوكوز + الفركتوز."
    }
  },
  {
    en: {
      q: "What enzyme is responsible for breaking down lactose in the small intestine?",
      options: [
        "Amylase",
        "Lipase",
        "Lactase",
        "Protease"
      ],
      correct: 2,
      feedback_correct: "Correct! Lactase is the enzyme produced by cells lining the small intestine that hydrolyzes lactose into its component monosaccharides: glucose and galactose. These simple sugars can then be absorbed into the bloodstream. The enzyme's name follows the naming convention: substrate name (lactose) + '-ase' suffix = lactase.",
      feedback_incorrect: "That's not the right enzyme. Lactase is the specific enzyme that breaks down lactose. Each enzyme mentioned has a different substrate: amylase breaks down starch, lipase breaks down fats, and protease breaks down proteins. Enzyme names typically end in '-ase' and are named after their substrate: lactose \u2192 lactase."
    },
    ar: {
      q: "ما الإنزيم المسؤول عن تكسير اللاكتوز في الأمعاء الدقيقة؟",
      options: [
        "الأميليز",
        "الليبيز",
        "اللاكتيز",
        "البروتييز"
      ],
      correct: 2,
      feedback_correct: "صحيح! اللاكتيز هو الإنزيم الذي تنتجه خلايا بطانة الأمعاء الدقيقة والذي يحلل اللاكتوز إلى مكوناته: الجلوكوز والغالاكتوز. تسمية الإنزيم تتبع القاعدة: اسم الركيزة (لاكتوز) + لاحقة '-يز' = لاكتيز.",
      feedback_incorrect: "ليس الإنزيم الصحيح. اللاكتيز هو الإنزيم المحدد الذي يكسر اللاكتوز. كل إنزيم مذكور له ركيزة مختلفة: الأميليز يكسر النشا، الليبيز يكسر الدهون، والبروتييز يكسر البروتينات."
    }
  },
  {
    en: {
      q: "What happens to undigested lactose in a person with lactose intolerance?",
      options: [
        "It is absorbed directly into the bloodstream",
        "It is converted into glucose by liver enzymes",
        "It passes to the large intestine where gut bacteria ferment it, producing gas and discomfort",
        "It is stored as glycogen in muscle tissue"
      ],
      correct: 2,
      feedback_correct: "Exactly! Without sufficient lactase, lactose passes intact into the large intestine (colon). There, gut bacteria ferment the undigested sugar, producing hydrogen gas, carbon dioxide, methane, and short-chain fatty acids. This fermentation causes the classic symptoms: bloating, gas, abdominal cramps, and diarrhea. The osmotic effect of unabsorbed lactose also draws water into the intestine.",
      feedback_incorrect: "That's not what happens. Without lactase to break it down, lactose cannot be absorbed in the small intestine. Instead, it travels intact to the large intestine where resident bacteria ferment it. This bacterial fermentation produces gases (hydrogen, CO\u2082, methane) and draws water into the colon by osmosis, causing bloating, gas, cramps, and diarrhea."
    },
    ar: {
      q: "ماذا يحدث للاكتوز غير المهضوم لدى شخص يعاني من عدم تحمل اللاكتوز؟",
      options: [
        "يتم امتصاصه مباشرة في مجرى الدم",
        "يتحول إلى جلوكوز بواسطة إنزيمات الكبد",
        "ينتقل إلى الأمعاء الغليظة حيث تخمره البكتيريا المعوية، مسبباً الغازات وعدم الراحة",
        "يتم تخزينه كغلايكوجين في الأنسجة العضلية"

// ===== FUNCTIONS =====
function toggleLang() {
  currentLang = currentLang === 'en' ? 'ar' : 'en';
  document.body.classList.toggle('ar', currentLang === 'ar');
  updateUI();
  renderQuestion();
}

function updateUI() {
  const t = uiText[currentLang];
  document.getElementById('quizTitle').textContent = t.title;
  document.getElementById('quizSubtitle').textContent = t.subtitle;
  document.getElementById('quizMeta').textContent = t.meta;
  document.getElementById('langBtn').textContent = t.lang;
  document.getElementById('prevLabel').innerHTML = t.prev;
  document.getElementById('scoreDisplay').textContent = t.score + ': ' + score;
  updateProgressText();
  updateNextButton();
}

function updateProgressText() {
  const t = uiText[currentLang];
  document.getElementById('progressText').textContent =
    t.questionLabel + ' ' + (currentQuestion + 1) + ' / ' + questions.length;
  document.getElementById('progressFill').style.width =
    ((currentQuestion + 1) / questions.length * 100) + '%';
}

function updateNextButton() {
  const t = uiText[currentLang];
  const isLast = currentQuestion === questions.length - 1;
  document.getElementById('nextLabel').innerHTML = isLast ? t.finish : t.next;
}

function buildDots() {
  const container = document.getElementById('questionDots');
  container.innerHTML = '';
  for (let i = 0; i < questions.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    if (i === currentQuestion) dot.classList.add('active');
    if (answers[i] === true) dot.classList.add('answered-correct');
    if (answers[i] === false) dot.classList.add('answered-incorrect');
    dot.onclick = () => goToQuestion(i);
    container.appendChild(dot);
  }
}

function goToQuestion(idx) {
  currentQuestion = idx;
  renderQuestion();
}

function renderQuestion() {
  const t = uiText[currentLang];
  const qData = questions[currentQuestion][currentLang];

  document.getElementById('questionNumber').textContent = t.questionLabel + ' ' + (currentQuestion + 1);
  document.getElementById('questionText').textContent = qData.q;

  const optionsList = document.getElementById('optionsList');
  optionsList.innerHTML = '';
  const letters = currentLang === 'en' ? ['A','B','C','D'] : ['\u0623','\u0628','\u062c','\u062f'];

  qData.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';

    const isAnswered = answers[currentQuestion] !== null;

    if (isAnswered) {
      btn.classList.add('disabled');
      if (idx === selectedOptions[currentQuestion] && answers[currentQuestion] === false) {
        btn.classList.add('incorrect');
      }
      if (idx === qData.correct) {
        btn.classList.add(idx === selectedOptions[currentQuestion] ? 'correct' : 'show-correct');
      }
    }

    btn.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${opt}</span>`;

    if (!isAnswered) {
      btn.onclick = () => selectAnswer(idx);
    }

    optionsList.appendChild(btn);
  });

  // Show/hide feedback
  const feedbackBox = document.getElementById('feedbackBox');
  if (answers[currentQuestion] !== null) {
    const isCorrect = answers[currentQuestion];
    feedbackBox.className = 'feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
    document.getElementById('feedbackTitle').innerHTML =
      `<span class="icon">${isCorrect ? '\u2705' : '\u274c'}</span> ${isCorrect ? t.correct : t.incorrect}`;
    document.getElementById('feedbackText').textContent =
      isCorrect ? qData.feedback_correct : qData.feedback_incorrect;
  } else {
    feedbackBox.className = 'feedback-box';
  }

  // Nav buttons
  document.getElementById('prevBtn').disabled = currentQuestion === 0;
  document.getElementById('nextBtn').disabled = answers[currentQuestion] === null;

  updateProgressText();
  updateNextButton();
  buildDots();
}

function selectAnswer(idx) {
  const qData = questions[currentQuestion][currentLang];
  const isCorrect = idx === qData.correct;

  answers[currentQuestion] = isCorrect;
  selectedOptions[currentQuestion] = idx;

  if (isCorrect) score++;

  document.getElementById('scoreDisplay').textContent = uiText[currentLang].score + ': ' + score;
  document.getElementById('nextBtn').disabled = false;

  renderQuestion();
}

function nextQuestion() {
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    renderQuestion();
    document.getElementById('questionCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    showResults();
  }
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('questionDots').style.display = 'none';

  const resultsCard = document.getElementById('resultsCard');
  resultsCard.classList.add('show');

  const t = uiText[currentLang];
  const pct = Math.round((score / questions.length) * 100);

  document.getElementById('resultsTitle').textContent = t.resultsTitle;
  document.getElementById('resultsScore').textContent = pct + '%';
  document.getElementById('correctCount').textContent = score;
  document.getElementById('incorrectCount').textContent = questions.length - score;
  document.getElementById('totalCount').textContent = questions.length;
  document.getElementById('correctLabel').textContent = t.correctLabel;
  document.getElementById('incorrectLabel').textContent = t.incorrectLabel;
  document.getElementById('totalLabel').textContent = t.totalLabel;
  document.getElementById('retryBtn').textContent = t.retry;

  let msg, icon;
  if (pct >= 80) { msg = t.excellent; icon = '\ud83c\udfc6'; }
  else if (pct >= 50) { msg = t.good; icon = '\ud83d\udc4d'; }
  else { msg = t.needsWork; icon = '\ud83d\udcda'; }

  document.getElementById('resultsIcon').textContent = icon;
  document.getElementById('resultsMessage').textContent = msg;
}

function restartQuiz() {
  currentQuestion = 0;
  score = 0;
  answers = new Array(questions.length).fill(null);
  selectedOptions = new Array(questions.length).fill(-1);

  document.getElementById('questionCard').style.display = '';
  document.getElementById('questionDots').style.display = '';
  document.getElementById('resultsCard').classList.remove('show');
  document.getElementById('scoreDisplay').textContent = uiText[currentLang].score + ': 0';

  renderQuestion();
}

// ===== KEYBOARD NAVIGATION =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextQuestion();
  if (e.key === 'ArrowLeft') prevQuestion();
  if (['1','2','3','4'].includes(e.key) && answers[currentQuestion] === null) {
    selectAnswer(parseInt(e.key) - 1);
  }
});

// ===== INIT =====
renderQuestion();
updateUI();
</script>
</body>
</html>
