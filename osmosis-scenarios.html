<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osmosis in Everyday Life — Case Scenarios</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#1b1028,#2c1a3f);color:#f1ecf7;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:24px 18px}
h1{text-align:center;font-size:1.8rem;background:linear-gradient(90deg,#ffb347,#ff6f91);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#c7b3dd;margin:6px 0 16px}
.toggle{display:flex;justify-content:center;gap:10px;margin-bottom:18px}
.toggle button{background:#2c1a3f;border:2px solid #5a3a80;color:#c7b3dd;padding:7px 18px;border-radius:20px;cursor:pointer}
.toggle button.on{border-color:#ffb347;color:#ffb347}
.intro{background:#24153a;border:1px solid #5a3a80;border-radius:14px;padding:16px 18px;line-height:1.6;margin-bottom:18px}
.intro b{color:#ffb347}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:#24153a;border:1px solid #5a3a80;border-radius:16px;padding:18px;display:flex;flex-direction:column}
.tag{display:inline-block;font-size:.75rem;padding:3px 10px;border-radius:12px;margin-bottom:8px;background:#3d2560;color:#ffb347;align-self:flex-start}
.card h3{font-size:1.1rem;margin-bottom:8px;color:#ffd6a5}
.card p{line-height:1.55;font-size:.95rem}
.qs{margin:10px 0 0 18px;line-height:1.55;font-size:.93rem;color:#e3d6f2}
.ans{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#123326;border:1px solid #2ecc71;line-height:1.5;font-size:.92rem}
.card button{margin-top:auto;margin-top:12px;background:linear-gradient(90deg,#ffb347,#ff6f91);border:none;color:#1b1028;font-weight:600;padding:9px;border-radius:10px;cursor:pointer}
[dir=rtl] .qs{margin:10px 18px 0 0}
footer{text-align:center;font-size:.75rem;color:#9c86b8;margin-top:22px}
</style></head><body><div class="wrap" id="app"></div>
<script>
const DATA={"en": {"title": "Osmosis in Everyday Life", "sub": "AI-generated case scenarios · Group discussion (groups of 5, 25 minutes)", "btn": "Show / hide model explanation", "intro": "<b>Quick recap.</b> Water moves by <b>osmosis</b> across a selectively permeable membrane from the side with <b>lower solute</b> concentration to the side with <b>higher solute</b> concentration. Relative to a cell, a solution can be <b>hypotonic</b> (water enters), <b>isotonic</b> (no net movement) or <b>hypertonic</b> (water leaves). Plant cells in hypotonic solution become <b>turgid</b>; in hypertonic solution they undergo <b>plasmolysis</b>. Animal cells lack a wall: they can swell and <b>lyse</b>, or shrink (<b>crenate</b>).<br><br><b>Task:</b> each group discusses all four scenarios (5 min each), using the terms hypotonic, hypertonic, isotonic, turgor and plasmolysis. In the last 5 minutes groups share one explanation with the class.", "foot": "AI-generated teaching resource (drafted with an AI assistant, reviewed by the instructor) · General Biology for Health Sciences", "cards": [{"tag": "Market", "t": "The vegetable seller’s spray bottle", "s": "At the market, the seller keeps spraying lettuce and parsley with water. By late afternoon the unsprayed bunches are limp.", "q": ["Is the water on the leaves hypotonic, isotonic or hypertonic to the leaf cells?", "What happens to the central vacuole and turgor pressure?", "Why do unsprayed leaves wilt?"], "a": "Tap water is hypotonic to leaf cells, so water enters by osmosis, the central vacuole fills and the cell pushes against its wall (turgor) — the leaves stay crisp. Unsprayed leaves keep losing water by evaporation, turgor falls and the leaves wilt."}, {"tag": "Kitchen", "t": "Salt on the salad", "s": "A salad salted 30 minutes before serving is soggy, with liquid pooled in the bowl.", "q": ["Is salty dressing hypotonic or hypertonic to the vegetable cells?", "In which direction does water move?", "What is plasmolysis and why does it make the salad limp?"], "a": "The salt solution on the surface is hypertonic, so water leaves the cells by osmosis and collects in the bowl. The cytoplasm and vacuole shrink away from the cell wall (plasmolysis), turgor is lost and the vegetables go limp. Salting just before serving limits the time for osmosis."}, {"tag": "Hospital", "t": "Which IV fluid?", "s": "A dehydrated patient needs an intravenous drip. A trainee suggests pure sterile water “because the patient needs water”.", "q": ["What would happen to red blood cells if pure water were infused?", "Why is 0.9% NaCl (normal saline) used instead?", "What would a strongly hypertonic solution do to red blood cells?"], "a": "Pure water is hypotonic to red blood cells: water rushes in and the cells swell and burst (haemolysis), which is dangerous. 0.9% NaCl is isotonic with plasma, so cells keep their volume. A hypertonic solution would draw water out and the cells would shrink (crenation)."}, {"tag": "Clinic", "t": "Cystic fibrosis and sticky mucus", "s": "In cystic fibrosis, the CFTR chloride channel in airway cells is faulty, and patients produce thick, sticky mucus.", "q": ["How does Cl⁻ normally leave airway cells, and what follows it?", "Why does less Cl⁻ secretion lead to drier, thicker mucus?", "Is CFTR an example of passive or active transport? Explain."], "a": "Normally Cl⁻ is secreted through CFTR channels; Na⁺ follows and water moves out by osmosis, keeping the mucus layer thin. With faulty CFTR, less salt and therefore less water reach the airway surface, so mucus becomes thick and hard to clear. CFTR is a channel: Cl⁻ moves down its electrochemical gradient (facilitated diffusion), although opening the channel requires ATP binding."}]}, "ar": {"title": "الخاصية الأسموزية في الحياة اليومية", "sub": "سيناريوهات حالات مولّدة بالذكاء الاصطناعي · نقاش جماعي (مجموعات من 5، 25 دقيقة)", "btn": "إظهار / إخفاء الإجابة النموذجية", "intro": "<b>مراجعة سريعة:</b> ينتقل الماء بالخاصية الأسموزية عبر غشاء اختياري النفاذية من الجهة الأقل تركيزًا للمذاب إلى الجهة الأعلى تركيزًا. قد يكون المحلول بالنسبة للخلية <b>منخفض التوتر</b> (يدخل الماء)، أو <b>متساوي التوتر</b>، أو <b>مرتفع التوتر</b> (يخرج الماء). الخلية النباتية في محلول منخفض التوتر تصبح <b>منتفخة</b>، وفي محلول مرتفع التوتر يحدث لها <b>بلزمة</b>. أما الخلية الحيوانية فقد تنتفخ وتنفجر أو تنكمش.<br><br><b>المهمة:</b> تناقش كل مجموعة السيناريوهات الأربعة (5 دقائق لكل منها) ثم تشارك تفسيرًا واحدًا مع الصف.", "foot": "مورد تعليمي مولّد بالذكاء الاصطناعي وراجعه المحاضر · الأحياء العامة للعلوم الصحية", "cards": [{"tag": "السوق", "t": "رذاذ بائع الخضار", "s": "يرش البائع الخس والبقدونس بالماء باستمرار، وبعد الظهر تذبل الحزم غير المرشوشة.", "q": ["هل الماء منخفض أم متساوٍ أم مرتفع التوتر بالنسبة لخلايا الورقة؟", "ماذا يحدث للفجوة العصارية وضغط الامتلاء؟", "لماذا تذبل الأوراق غير المرشوشة؟"], "a": "ماء الصنبور منخفض التوتر بالنسبة لخلايا الورقة فيدخلها الماء وتمتلئ الفجوة وتضغط الخلية على جدارها فتبقى الأوراق نضرة. الأوراق غير المرشوشة تفقد الماء بالتبخر فينخفض ضغط الامتلاء وتذبل."}, {"tag": "المطبخ", "t": "الملح على السلطة", "s": "سلطة مُلّحت قبل التقديم بنصف ساعة أصبحت رخوة وتجمّع السائل في الوعاء.", "q": ["هل الصلصة المالحة منخفضة أم مرتفعة التوتر؟", "في أي اتجاه يتحرك الماء؟", "ما البلزمة ولماذا تجعل السلطة رخوة؟"], "a": "المحلول الملحي مرتفع التوتر فيخرج الماء من الخلايا ويتجمع في الوعاء، فينكمش السيتوبلازم والفجوة بعيدًا عن الجدار (بلزمة) ويُفقد ضغط الامتلاء. التمليح قبل التقديم مباشرة يقلل زمن الأسموزية."}, {"tag": "المستشفى", "t": "أي محلول وريدي؟", "s": "مريض مصاب بالجفاف يحتاج محلولًا وريديًا، فاقترح متدرب ماءً معقمًا نقيًا «لأن المريض يحتاج ماء».", "q": ["ماذا يحدث لخلايا الدم الحمراء عند حقن ماء نقي؟", "لماذا يُستخدم محلول ملحي 0.9%؟", "ماذا يفعل محلول مرتفع التوتر جدًا بخلايا الدم الحمراء؟"], "a": "الماء النقي منخفض التوتر فيدخل الخلايا فتنتفخ وتنفجر (انحلال الدم) وهذا خطر. محلول 0.9% متساوي التوتر مع البلازما فتحافظ الخلايا على حجمها. المحلول مرتفع التوتر يسحب الماء فتنكمش الخلايا."}, {"tag": "العيادة", "t": "التليف الكيسي والمخاط اللزج", "s": "في التليف الكيسي تكون قناة الكلوريد CFTR معيبة في خلايا المجاري التنفسية، فينتج المرضى مخاطًا كثيفًا لزجًا.", "q": ["كيف يخرج الكلوريد عادة من الخلايا وماذا يتبعه؟", "لماذا يؤدي نقص إفراز الكلوريد إلى مخاط أكثف؟", "هل CFTR مثال على نقل سلبي أم نشط؟"], "a": "يُفرز الكلوريد عبر قنوات CFTR ويتبعه الصوديوم ثم الماء بالأسموزية فتبقى طبقة المخاط رقيقة. مع خلل القناة يقل الملح ثم الماء على السطح فيثخن المخاط. CFTR قناة ينتقل عبرها الكلوريد مع تدرجه (انتشار مُيسّر) وإن كان فتحها يتطلب ارتباط ATP."}]}};
let lang='en';
function render(){
 const d=DATA[lang];const app=document.getElementById('app');
 document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 app.innerHTML=`<h1>${d.title}</h1><p class="sub">${d.sub}</p>
 <div class="toggle"><button class="${lang==='en'?'on':''}" onclick="setL('en')">English</button><button class="${lang==='ar'?'on':''}" onclick="setL('ar')">العربية</button></div>
 <div class="intro">${d.intro}</div>
 <div class="grid">${d.cards.map((c,i)=>`<div class="card"><span class="tag">${c.tag}</span><h3>${c.t}</h3><p>${c.s}</p><ol class="qs">${c.q.map(x=>`<li>${x}</li>`).join('')}</ol><div class="ans" id="a${i}">${c.a}</div><button onclick="tog(${i})">${d.btn}</button></div>`).join('')}</div>
 <footer>${d.foot}</footer>`;}
function setL(l){lang=l;render()}
function tog(i){const e=document.getElementById('a'+i);e.style.display=e.style.display==='block'?'none':'block'}
render();
</script></body></html>
