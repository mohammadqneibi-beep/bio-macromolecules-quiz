<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enzymes in the Kitchen — Discussion Cards</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#1b1028,#2c1a3f);color:#f1ecf7;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:24px 18px}
h1{text-align:center;font-size:1.8rem;background:linear-gradient(90deg,#ffb347,#ff6f91);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#c7b3dd;margin:6px 0 16px}
.toggle{display:flex;justify-content:center;gap:10px;margin-bottom:18px}
.toggle button{background:#2c1a3f;border:2px solid #5a3a80;color:#c7b3dd;padding:7px 18px;border-radius:20px;cursor:pointer}
.toggle button.on{border-color:#ffb347;color:#ffb347}
.intro{background:#24153a;border:1px solid #5a3a80;border-radius:14px;padding:16px 18px;line-height:1.6;margin-bottom:18px}
.intro b{color:#ffb347}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:#24153a;border:1px solid #5a3a80;border-radius:16px;padding:18px;display:flex;flex-direction:column}
.tag{display:inline-block;font-size:.75rem;padding:3px 10px;border-radius:12px;margin-bottom:8px;background:#3d2560;color:#ffb347;align-self:flex-start}
.card h3{font-size:1.1rem;margin-bottom:8px;color:#ffd6a5}
.card p{line-height:1.55;font-size:.95rem}
.qs{margin:10px 0 0 18px;line-height:1.55;font-size:.93rem;color:#e3d6f2}
.ans{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#123326;border:1px solid #2ecc71;line-height:1.5;font-size:.92rem}
.card button{margin-top:auto;margin-top:12px;background:linear-gradient(90deg,#ffb347,#ff6f91);border:none;color:#1b1028;font-weight:600;padding:9px;border-radius:10px;cursor:pointer}
[dir=rtl] .qs{margin:10px 18px 0 0}
footer{text-align:center;font-size:.75rem;color:#9c86b8;margin-top:22px}
</style></head><body><div class="wrap" id="app"></div>
<script>
const DATA={"en": {"title": "Enzymes in the Kitchen", "sub": "AI-generated discussion cards · Group activity (groups of 5, 20 minutes)", "btn": "Show / hide model explanation", "intro": "<b>How to use:</b> each group takes two cards — one from <b>“Enzymes that help”</b> and one from <b>“Enzymes that cause havoc”</b>. Discuss the questions for 8 minutes per card using the terms <i>active site, substrate, denaturation, optimum temperature/pH, inhibition</i>. Then one member explains a card to the class in 1 minute. Reveal the model explanation only after your group has agreed on an answer.", "foot": "AI-generated teaching resource (drafted with an AI assistant, reviewed by the instructor) · General Biology for Health Sciences", "cards": [{"tag": "Enzymes that help", "t": "Pineapple marinade", "s": "A chef soaks tough beef in fresh pineapple juice for 2 hours. The meat becomes tender — but after 12 hours it turns mushy.", "q": ["Which enzyme is responsible and what is its substrate?", "Why does a longer marinade make the meat mushy?", "Why does canned (heat-treated) pineapple not tenderise meat?"], "a": "Bromelain is a protease that hydrolyses peptide bonds in muscle and connective-tissue proteins. Longer exposure = more proteins broken down, so the texture collapses. Canning heats the juice, which denatures bromelain (its active site loses its shape), so it no longer works."}, {"tag": "Enzymes that help", "t": "Making cheese", "s": "Rennet is added to warm milk (≈ 32 °C). Within 30–45 minutes the milk forms a solid curd and liquid whey.", "q": ["What does chymosin (in rennet) do to casein?", "Why is the milk warmed but not boiled?", "Why do vegetarian cheeses use microbial or fermentation-produced chymosin?"], "a": "Chymosin cleaves κ-casein, destabilising casein micelles so they clump into curd (with Ca²⁺). Warming brings the enzyme near its optimum; boiling would denature it. Microbial/recombinant chymosin has the same activity without using calf stomach."}, {"tag": "Enzymes that help", "t": "Bread rising", "s": "Dough with yeast and a little sugar doubles in size in a warm kitchen but barely rises in the fridge.", "q": ["Which process produces the gas that makes dough rise?", "Explain the effect of temperature on yeast enzymes.", "What happens to the yeast in the oven?"], "a": "Yeast enzymes ferment sugars (including maltose released by amylases from flour) to ethanol and CO₂; trapped CO₂ makes dough rise. Cold slows enzyme-catalysed reactions (fewer successful collisions). In the oven, enzymes denature and yeast dies; CO₂ and ethanol expand and escape, setting the crumb."}, {"tag": "Enzymes that cause havoc", "t": "Browning apples", "s": "Sliced apples turn brown within minutes. Slices dipped in lemon juice stay pale for much longer.", "q": ["Which enzyme causes browning and what does it need?", "Give two reasons why lemon juice slows browning.", "How does blanching prevent browning in frozen vegetables?"], "a": "Polyphenol oxidase oxidises phenolic compounds using O₂ released when cells are cut; products polymerise into brown pigments. Lemon juice lowers pH away from the enzyme optimum and its ascorbic acid reduces the quinones back. Blanching (brief heat) denatures the enzyme before freezing."}, {"tag": "Enzymes that cause havoc", "t": "Jelly that will not set", "s": "A student adds fresh kiwi to gelatin dessert. The next day it is still liquid.", "q": ["What is gelatin made of?", "Which enzyme in kiwi is responsible?", "Suggest two ways to fix the recipe."], "a": "Gelatin is denatured collagen (protein). Kiwi contains actinidin, a protease that hydrolyses the gelatin chains so they cannot form a gel network. Fix: use cooked/canned kiwi (enzyme denatured) or choose a fruit without proteases (e.g., berries)."}, {"tag": "Enzymes that cause havoc", "t": "Over-proofed dough", "s": "Dough left to rise for 6 hours in a hot kitchen collapses in the oven and tastes sour and alcoholic.", "q": ["What has happened to the sugars in the dough?", "Why does the gluten network fail?", "How could temperature be used to control proofing?"], "a": "Yeast and amylase activity used up most available sugar; fermentation continued, producing excess ethanol and acids. Prolonged gas production stretches and weakens gluten, and proteases plus acidity weaken it further, so the structure collapses. Cooler proofing (or the fridge) slows enzyme activity and gives more control."}]}, "ar": {"title": "الإنزيمات في المطبخ", "sub": "بطاقات نقاش مولّدة بالذكاء الاصطناعي · نشاط جماعي (مجموعات من 5 طلاب، 20 دقيقة)", "btn": "إظهار / إخفاء الإجابة النموذجية", "intro": "<b>طريقة الاستخدام:</b> تأخذ كل مجموعة بطاقتين — واحدة من <b>«إنزيمات مفيدة»</b> وأخرى من <b>«إنزيمات تسبب المشكلات»</b>. ناقشوا الأسئلة لمدة 8 دقائق لكل بطاقة مستخدمين المصطلحات: الموقع النشط، المادة المتفاعلة، تمسّخ البروتين، درجة الحرارة/الرقم الهيدروجيني الأمثل، التثبيط. ثم يشرح أحد الأعضاء البطاقة للصف في دقيقة واحدة. لا تُظهروا الإجابة النموذجية إلا بعد اتفاق المجموعة.", "foot": "مورد تعليمي مولّد بالذكاء الاصطناعي وراجعه المحاضر · الأحياء العامة للعلوم الصحية", "cards": [{"tag": "إنزيمات مفيدة", "t": "تتبيلة الأناناس", "s": "ينقع طاهٍ لحمًا قاسيًا في عصير أناناس طازج لمدة ساعتين فيصبح طريًا، لكن بعد 12 ساعة يصبح مهروسًا.", "q": ["ما الإنزيم المسؤول وما مادته المتفاعلة؟", "لماذا يصبح اللحم مهروسًا مع طول التتبيل؟", "لماذا لا يطري الأناناس المعلّب اللحم؟"], "a": "البروميلين إنزيم محلل للبروتين يكسر الروابط الببتيدية في بروتينات العضلات والنسيج الضام. طول التعرض يعني تحلل مزيد من البروتينات فينهار القوام. التعليب يسخّن العصير فيتمسّخ البروميلين ويفقد موقعه النشط شكله."}, {"tag": "إنزيمات مفيدة", "t": "صناعة الجبن", "s": "تضاف المنفحة إلى حليب دافئ (≈ 32 °م) فيتكوّن خلال 30–45 دقيقة خثار صلب ومصل سائل.", "q": ["ماذا يفعل الكيموسين بالكازين؟", "لماذا يُدفّأ الحليب ولا يُغلى؟", "لماذا تستخدم الأجبان النباتية كيموسين ميكروبي المصدر؟"], "a": "يشطر الكيموسين كابا-كازين فتفقد مذيلات الكازين ثباتها وتتكتل خثارًا بوجود الكالسيوم. التدفئة تقرّب الإنزيم من درجته المثلى، والغليان يمسخه. الكيموسين الميكروبي أو المؤتلف له النشاط نفسه دون استخدام معدة العجل."}, {"tag": "إنزيمات مفيدة", "t": "تخمّر الخبز", "s": "عجينة فيها خميرة وقليل من السكر يتضاعف حجمها في مطبخ دافئ لكنها بالكاد ترتفع في الثلاجة.", "q": ["ما العملية التي تنتج الغاز الذي يرفع العجين؟", "اشرح أثر الحرارة في إنزيمات الخميرة.", "ماذا يحدث للخميرة في الفرن؟"], "a": "تخمّر إنزيمات الخميرة السكريات (ومنها المالتوز الناتج بفعل الأميليز) إلى إيثانول وثاني أكسيد الكربون الذي ينحبس فيرفع العجين. البرودة تبطئ التفاعلات الإنزيمية. في الفرن تتمسخ الإنزيمات وتموت الخميرة ويتمدد الغاز ويخرج."}, {"tag": "إنزيمات تسبب المشكلات", "t": "اسمرار التفاح", "s": "تسمرّ شرائح التفاح خلال دقائق، بينما تبقى الشرائح المغموسة في عصير الليمون فاتحة مدة أطول.", "q": ["ما الإنزيم المسبب للاسمرار وماذا يحتاج؟", "اذكر سببين لإبطاء عصير الليمون للاسمرار.", "كيف يمنع السلق السريع اسمرار الخضار المجمدة؟"], "a": "يؤكسد إنزيم بوليفينول أوكسيديز المركبات الفينولية بوجود الأكسجين عند قطع الخلايا فتتكون صبغات بنية. عصير الليمون يخفض الرقم الهيدروجيني بعيدًا عن الأمثل، وحمض الأسكوربيك فيه يعيد اختزال النواتج. السلق يمسخ الإنزيم قبل التجميد."}, {"tag": "إنزيمات تسبب المشكلات", "t": "هلام لا يتماسك", "s": "أضاف طالب كيوي طازجًا إلى حلوى الجيلاتين فبقيت سائلة في اليوم التالي.", "q": ["مم يتكون الجيلاتين؟", "ما الإنزيم المسؤول في الكيوي؟", "اقترح طريقتين لإصلاح الوصفة."], "a": "الجيلاتين كولاجين متمسّخ (بروتين). يحتوي الكيوي على الأكتينيدين المحلل للبروتين فيكسر سلاسل الجيلاتين فلا تتكون شبكة هلامية. الحل: استخدام كيوي مطبوخ أو معلّب، أو فاكهة لا تحتوي إنزيمات محللة للبروتين كالتوت."}, {"tag": "إنزيمات تسبب المشكلات", "t": "عجين مفرط التخمير", "s": "عجين تُرك 6 ساعات في مطبخ حار انهار في الفرن وأصبح طعمه حامضًا وكحوليًا.", "q": ["ماذا حدث للسكريات في العجين؟", "لماذا فشلت شبكة الغلوتين؟", "كيف تُستخدم الحرارة للتحكم في التخمير؟"], "a": "استهلكت الخميرة والأميليز معظم السكريات واستمر التخمر فتراكم الإيثانول والأحماض. طول إنتاج الغاز يمدّ الغلوتين ويضعفه، وتزيد الحموضة والإنزيمات المحللة ضعفه فينهار. التخمير في مكان أبرد يبطئ النشاط الإنزيمي ويمنح تحكمًا أكبر."}]}};
let lang='en';
function render(){
 const d=DATA[lang];const app=document.getElementById('app');
 document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 app.innerHTML=`<h1>${d.title}</h1><p class="sub">${d.sub}</p>
 <div class="toggle"><button class="${lang==='en'?'on':''}" onclick="setL('en')">English</button><button class="${lang==='ar'?'on':''}" onclick="setL('ar')">العربية</button></div>
 <div class="intro">${d.intro}</div>
 <div class="grid">${d.cards.map((c,i)=>`<div class="card"><span class="tag">${c.tag}</span><h3>${c.t}</h3><p>${c.s}</p><ol class="qs">${c.q.map(x=>`<li>${x}</li>`).join('')}</ol><div class="ans" id="a${i}">${c.a}</div><button onclick="tog(${i})">${d.btn}</button></div>`).join('')}</div>
 <footer>${d.foot}</footer>`;}
function setL(l){lang=l;render()}
function tog(i){const e=document.getElementById('a'+i);e.style.display=e.style.display==='block'?'none':'block'}
render();
</script></body></html>
